# ==============================================================================
# 水利新建工程全流程电子台账系统 — 核心配置文件
# （在 Windows 下可直接用“记事本”打开编辑，保存时请保持 UTF-8 编码）
# ==============================================================================

# 一、 在管水利工程项目白名单
# 说明：
# 1. standard_name：归档后的一级文件夹名称，同时也是文件重命名“年月日-项目名称-类型”中的标准项目名。
#    建议使用简明规范的项目名称（不要含 \ / : * ? " < > | - 等特殊符号）。
# 2. keywords：匹配关键词列表。只要文件内容或原文件名中包含任意一个关键词，就会自动归入该项目！
# 3. 如果收到的文件未命中下方任何一个项目的关键词，系统会自动将其放入“99_待人工确认”文件夹，
#    防止因为全称/简称不统一而乱建碎片文件夹。
# 4. skip_milestones（可选）：如果某个项目规模较小，不需要某项特定批文（如不需要“征地移民安置批复”），
#    可在此处列出跳过，看板计算“已齐备”绿灯时将自动剔除该项。
# 5. add_milestones（可选）：可为特定项目在某阶段额外增加专属必办要件。

projects:
  - standard_name: "清河水库除险加固工程"
    project_type: "水库枢纽工程"
    keywords:
      - "清河水库"
      - "清河枢纽"
      - "清河除险加固"
    skip_milestones: []
    add_milestones: {}

  - standard_name: "东渠灌区续建配套工程"
    project_type: "灌区节水改造工程"
    keywords:
      - "东渠灌区"
      - "东渠续建"
      - "东渠干渠"
      - "东渠节水"
    skip_milestones: []
    add_milestones: {}


# 二、 归档与监听通用设置
settings:
  # 后台自动监听扫描间隔（秒）
  watch_interval_seconds: 2.0
  # 每次归档完成或有待人工确认文件时，是否在 Windows 右下角弹出系统通知
  enable_windows_notification: true
  # 重命名中“文件具体类型”段的最大字符数（防止 Windows 路径超过 260 字符上限）
  max_doc_type_length: 34


# 三、 可选 AI 大模型增强识别接口（默认关闭，纯本地离线即可高精度运行）
# 说明：
# 开启后，可调用兼容 OpenAI 接口的大模型（如 DeepSeek、通义千问、Kimi 等）辅助提取复杂合同金额、文号与非标函件类型。
# 若断网或未填 api_key，系统会自动无缝使用本地规则引擎，绝不影响归档。
ai_llm:
  enabled: false
  # mode 可选 "fallback"（仅当本地规则对阶段/文号把握度低时调用，省额度）或 "always"（每份文件均增强提炼）
  mode: "fallback"
  api_base: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-chat"
  timeout_seconds: 15
