name: Build Windows Water Project Ledger EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows-portable:
    name: Build Standalone Windows Portable Package (.exe + Offline Chinese OCR)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'system/requirements-windows.txt'

      - name: Install Windows dependencies (RapidOCR + PyMuPDF + Office libs + PyInstaller)
        working-directory: system
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Compile standalone ledger_engine.exe with PyInstaller
        working-directory: system
        shell: pwsh
        run: |
          $vcArgs = @()
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "concrt140.dll")) {
            $sysDll = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $sysDll) {
              $vcArgs += "--add-binary"
              $vcArgs += "$sysDll;."
            }
          }

          pyinstaller --noconfirm --clean --onedir `
            --name ledger_engine `
            --distpath ./dist_bin `
            --workpath ./build_tmp `
            --paths . `
            --collect-all rapidocr_onnxruntime `
            --collect-all onnxruntime `
            --collect-all cv2 `
            --collect-all PyMuPDF `
            --hidden-import fitz `
            --hidden-import pymupdf `
            --hidden-import config_loader `
            --hidden-import extractor `
            --hidden-import classifier `
            --hidden-import database `
            --hidden-import progress_calc `
            --hidden-import excel_builder `
            --hidden-import html_builder `
            --hidden-import notifier `
            --hidden-import reconciler `
            --hidden-import demo_seeder `
            --hidden-import docx `
            --hidden-import openpyxl `
            --hidden-import yaml `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            @vcArgs `
            main.py

      - name: Assemble Portable Folder & Verify End-to-End Demo on Real Windows
        shell: pwsh
        run: |
          $stageRoot = Join-Path $PWD "release_stage\水利工程电子台账"
          New-Item -ItemType Directory -Force -Path "$stageRoot\system\runtime" | Out-Null

          Copy-Item "项目配置.yaml" "$stageRoot\" -Force
          Copy-Item "使用指南.md" "$stageRoot\" -Force
          Copy-Item "*.bat" "$stageRoot\" -Force
          Copy-Item "*.vbs" "$stageRoot\" -Force
          Copy-Item "system\*.bat" "$stageRoot\system\" -Force
          Copy-Item "system\*.py" "$stageRoot\system\" -Force
          Copy-Item "system\requirements-windows.txt" "$stageRoot\system\" -Force
          Copy-Item "system\dist_bin\ledger_engine\*" "$stageRoot\system\runtime\" -Recurse -Force

          Write-Host "=== Running compiled ledger_engine.exe end-to-end verification on Windows ==="
          & "$stageRoot\system\runtime\ledger_engine.exe" reset --yes --root "$stageRoot"
          if ($LASTEXITCODE -ne 0) { throw "ledger_engine.exe reset failed with exit code $LASTEXITCODE" }

          & "$stageRoot\system\runtime\ledger_engine.exe" demo --root "$stageRoot"
          if ($LASTEXITCODE -ne 0) { throw "ledger_engine.exe demo failed with exit code $LASTEXITCODE" }

          if (-not (Test-Path "$stageRoot\工程全流程总台账.xlsx")) {
            throw "Master Excel ledger was not generated!"
          }
          if (-not (Test-Path "$stageRoot\项目状态可视化看板.html")) {
            throw "Dashboard HTML was not generated!"
          }

          Push-Location "release_stage"
          7z a -tzip -mx=5 -mcu=on "..\水利工程电子台账_Windows绿色免安装版.zip" "水利工程电子台账"
          Pop-Location

          Get-Item ".\水利工程电子台账_Windows绿色免安装版.zip" | Format-List Name, Length

      - name: Upload Windows Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 水利工程电子台账_Windows绿色免安装版
          path: ./水利工程电子台账_Windows绿色免安装版.zip
          retention-days: 30
